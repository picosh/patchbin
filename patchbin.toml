url = "localhost"            # used for help commands (exclude protocol)
data_dir = "./data"          # loc for sqlite db, this toml file, and ssh host keys
admins = []                  # list of admin ssh pubkeys
time_format = "2006-01-02"   # set datetime format for our clients (golang datestr fmt)
desc = ""                    # adds description box to top of index page (supports HTML)
